name: Build desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sampler_hub_ref:
        description: Sampler-Hub ref to build against, empty for the pinned version
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x86_64, bundles: nsis }
          - { os: windows-11-arm, platform: windows-aarch64, bundles: nsis }
          - { os: macos-latest, platform: macos-aarch64, bundles: 'dmg,app' }
          # oldest glibc the appimage still runs on
          - { os: ubuntu-24.04, platform: linux-x86_64, bundles: 'appimage,deb' }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, bundles: 'appimage,deb' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: opera
    steps:
      # the desktop crate points at ../../Sampler-Hub
      - uses: actions/checkout@v4
        with:
          path: opera

      - name: Read versions
        id: versions
        run: |
          echo "app=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          echo "hub=$(node -p "require('./sampler-hub-client.json').version")" >> "$GITHUB_OUTPUT"
          # updater tells betas apart by this
          bundle="$(node -p "require('./app.json').expo.version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then bundle="${GITHUB_REF_NAME#v}"; fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches app.json
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          # strip the beta suffix
          tag_version="${tag_version%%-beta*}"
          if [ "${{ steps.versions.outputs.app }}" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match app.json version ${{ steps.versions.outputs.app }}" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: MaestroAI-Company/Sampler-Hub
          ref: ${{ inputs.sampler_hub_ref || steps.versions.outputs.hub }}
          path: Sampler-Hub

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: opera/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            opera/src-tauri -> target
            Sampler-Hub -> target/sidecar

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libgbm-dev

      # ring needs clang for aarch64 windows
      - name: Put clang on the path
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          if ! command -v clang >/dev/null; then
            echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
          fi

      - name: Install dependencies
        if: runner.os != 'Windows' || runner.arch != 'ARM64'
        run: npm install

      # sharp has no arm windows build and the app never runs it
      - name: Install dependencies without native scripts
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          npm install --ignore-scripts
          npx patch-package

      # the sidecar builds from the checkout, prebuild:desktop runs it
      - name: Build desktop bundle
        env:
          SAMPLER_HUB_DIR: ${{ github.workspace }}/Sampler-Hub
          # tells a beta build its beta number
          EXPO_PUBLIC_RELEASE_TAG: ${{ github.ref_name }}
          # signs the updater artifacts
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # the secret was saved with a utf-8 bom
          TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | sed '1s/^\xEF\xBB\xBF//')"
          export TAURI_SIGNING_PRIVATE_KEY
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r\n')"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          extra=()
          # arm linux has no dawn build to ship
          if [ "${{ matrix.platform }}" = linux-aarch64 ]; then
            extra=(--config '{"bundle":{"linux":{"deb":{"files":null}}}}')
          fi
          # linuxdeploy must find dawn and its strip chokes on it
          if [ "${{ matrix.platform }}" = linux-x86_64 ]; then
            export LD_LIBRARY_PATH="$PWD/src-tauri/target/release" NO_STRIP=1
          fi
          npm run build:desktop -- --bundles ${{ matrix.bundles }} --config '{"version":"${{ steps.versions.outputs.bundle }}","bundle":{"createUpdaterArtifacts":true}}' "${extra[@]}"

      # stable names so the website can link them
      - name: Collect bundles
        run: |
          bundle=src-tauri/target/release/bundle
          mkdir -p dist-desktop
          case "${{ matrix.platform }}" in
            windows-*)
              cp "$bundle"/nsis/*-setup.exe "dist-desktop/opera-${{ matrix.platform }}-setup.exe"
              cp "$bundle"/nsis/*-setup.exe.sig "dist-desktop/opera-${{ matrix.platform }}-setup.exe.sig" ;;
            macos-*)
              cp "$bundle"/dmg/*.dmg "dist-desktop/opera-${{ matrix.platform }}.dmg"
              cp "$bundle"/macos/*.app.tar.gz "dist-desktop/opera-${{ matrix.platform }}.app.tar.gz"
              cp "$bundle"/macos/*.app.tar.gz.sig "dist-desktop/opera-${{ matrix.platform }}.app.tar.gz.sig" ;;
            linux-*)
              cp "$bundle"/appimage/*.AppImage "dist-desktop/opera-${{ matrix.platform }}.AppImage"
              cp "$bundle"/appimage/*.AppImage.sig "dist-desktop/opera-${{ matrix.platform }}.AppImage.sig"
              cp "$bundle"/deb/*.deb "dist-desktop/opera-${{ matrix.platform }}.deb" ;;
          esac
          ls -la dist-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: opera-${{ matrix.platform }}
          path: opera/dist-desktop/
          retention-days: 7

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # the release notes live in the repo
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            distribution
            scripts/build-updater-manifest.mjs

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: opera-*
          merge-multiple: true

      # each release carries its own manifest
      - name: Write the updater manifest
        run: node scripts/build-updater-manifest.mjs dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" distribution/release-notes.md

      # the apk workflow may have opened the release already
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # betas stay off the latest release
          kind=--latest
          if [[ "$GITHUB_REF_NAME" == *-beta* ]]; then kind=--prerelease; fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Opera ${GITHUB_REF_NAME#v}" --notes-file distribution/release-notes.md "$kind" --verify-tag \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release edit "$GITHUB_REF_NAME" --notes-file distribution/release-notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
