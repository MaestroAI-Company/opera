[package]
name = "app"
version = "0.1.0"
description = "Opera desktop app"
authors = ["Maestro AI"]
license = "AGPL-3.0-only"
repository = "https://github.com/MaestroAI-Company/opera"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-oauth = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1", features = ["sync", "time"] }

#desktop only, the hub client is native code
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
opera-hub = { path = "../../opera-hub/crates/opera-hub", default-features = false }
opera-hub-client = { path = "../../opera-hub/crates/opera-hub-client" }
machine-uid = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
