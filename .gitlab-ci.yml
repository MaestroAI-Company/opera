stages:
  - test
  - secret-detection
  - build
  - release

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

sast:
  stage: test

secret_detection:
  stage: secret-detection

build_apk:
  stage: build
  image: reactnativecommunity/react-native-android
  before_script:
    #setup node.js 20
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    #setup jdk 17
    - apt-get update && apt-get install -y openjdk-17-jdk
    - update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java || true
  script:
    - npm install
    - cd android && chmod +x gradlew && cd ..
    - npm run build:android
  artifacts:
    paths:
      - android/app/build/outputs/apk/release/app-release.apk
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

release_beta:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "Deleting old beta release and tag..."
      curl --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/beta" || true
      curl --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags/beta" || true
      echo "Creating new GitLab release for beta APK..."
      curl --header "Content-Type: application/json" --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
      --data "{
        \"name\": \"Beta Release\",
        \"tag_name\": \"beta\",
        \"ref\": \"${CI_COMMIT_SHA}\",
        \"description\": \"Automated beta build from the latest push.\",
        \"assets\": {
          \"links\": [{
            \"name\": \"app-release.apk\",
            \"url\": \"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/android/app/build/outputs/apk/release/app-release.apk?job=build_apk\"
          }]
        }
      }" \
      --request POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
