name: Build iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Beta tag that numbers the build, like v1.1.0-beta.8
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      # gives a beta its number
      EXPO_PUBLIC_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the App Store Connect key
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8_BASE64 secrets are required" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches app.json
        if: github.ref_type == 'tag'
        run: |
          app_version=$(node -p "require('./app.json').expo.version")
          tag_version="${GITHUB_REF_NAME#v}"
          # strip the beta suffix
          tag_version="${tag_version%%-beta*}"
          if [ "$app_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match app.json version $app_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      # pod install fetches hub client
      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios

      # expo writes a fixed build number in each info.plist so the build setting is ignored
      - name: Set the build number
        run: |
          find ios -name Info.plist -not -path 'ios/Pods/*' -not -path '*/build/*' | while read -r plist; do
            if /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$plist"
              echo "$plist"
            fi
          done

      - name: Write the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      # the key cannot sign in the cloud and automatic signing makes a new certificate per run, so we sign with our own certificate and profiles
      - name: Install the distribution certificate and profiles
        env:
          MAS_CERTIFICATES_P12_BASE64: ${{ secrets.MAS_CERTIFICATES_P12_BASE64 }}
          MAS_CERTIFICATES_PASSWORD: ${{ secrets.MAS_CERTIFICATES_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
          IOS_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROFILE_SHARE_BASE64 }}
        run: |
          for name in MAS_CERTIFICATES_P12_BASE64 MAS_CERTIFICATES_PASSWORD IOS_PROFILE_APP_BASE64 IOS_PROFILE_WIDGET_BASE64 IOS_PROFILE_SHARE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "$name secret is required" >&2
              exit 1
            fi
          done
          password=$(uuidgen)
          keychain="$RUNNER_TEMP/ios.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MAS_CERTIFICATES_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$MAS_CERTIFICATES_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep "Apple Distribution" || { echo "no apple distribution certificate in the p12" >&2; exit 1; }
          # xcode finds profiles by uuid in this folder
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          for encoded in "$IOS_PROFILE_APP_BASE64" "$IOS_PROFILE_WIDGET_BASE64" "$IOS_PROFILE_SHARE_BASE64"; do
            echo "$encoded" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
            cp "$RUNNER_TEMP/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          done

      # each target needs its own profile so the project cannot keep automatic signing
      - name: Sign the targets manually
        run: |
          gem install xcodeproj --user-install --no-document
          ruby <<'RUBY'
          require 'xcodeproj'
          profiles = {
            'Opera' => 'Opera iOS opera',
            'ExpoWidgetsTarget' => 'Opera iOS ExpoWidgetsTarget',
            'ShareExtension' => 'Opera iOS share-extension'
          }
          project_path = Dir['ios/*.xcodeproj'].first
          project = Xcodeproj::Project.open(project_path)
          done = []
          project.targets.each do |target|
            profile = profiles[target.name]
            next unless profile
            target.build_configurations.each do |config|
              settings = config.build_settings
              settings['CODE_SIGN_STYLE'] = 'Manual'
              settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
              settings['DEVELOPMENT_TEAM'] = '646R946C79'
              settings['PROVISIONING_PROFILE_SPECIFIER'] = profile
            end
            done << target.name
          end
          missing = profiles.keys - done
          abort("targets not found: #{missing.join(', ')}") unless missing.empty?
          project.save
          puts "signed manually: #{done.join(', ')}"
          RUBY

      - name: Archive
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          # reused build numbers are refused
          xcodebuild archive \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Opera.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # upload destination sends to testflight
      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>646R946C79</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ai.maestro.opera</key>
              <string>Opera iOS opera</string>
              <key>ai.maestro.opera.ExpoWidgetsTarget</key>
              <string>Opera iOS ExpoWidgetsTarget</string>
              <key>ai.maestro.opera.share-extension</key>
              <string>Opera iOS share-extension</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Opera.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
