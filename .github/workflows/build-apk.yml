name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # the secrets context is rejected in step-level if, so hoist the checks here
    env:
      HAS_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest only has ~14GB free, not enough for the NDK build
      # (arm64-v8a + armeabi-v7a) which otherwise fails with ENOSPC
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches app.json
        if: github.ref_type == 'tag'
        run: |
          app_version=$(node -p "require('./app.json').expo.version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$app_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match app.json version $app_version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      # the private-repo runner is 2 vcpu / 8gb and the image ships no swap
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # 6g fits in 8gb of ram once the swapfile absorbs the r8 and bundletool peaks
      - name: Tune Gradle memory
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=1"
          } >> android/gradle.properties

      # lintVital ooms on AICoreModule.kt and competes with r8 for the same heap
      - name: Disable release lint
        run: echo 'android { lint { checkReleaseBuilds false } }' >> android/app/build.gradle

      - uses: gradle/actions/setup-gradle@v4

      # absent on push-to-main builds, so those stay signed with the debug key
      - name: Decode upload keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          keystore_path="$RUNNER_TEMP/upload-keystore.jks"
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$keystore_path"
          echo "UPLOAD_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        env:
          # x86 abis crash on ndk27 clang
          # armeabi-v7a unsupported by executorch
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          # baked into the js bundle, so it has to be set before gradle bundles
          EXPO_PUBLIC_BETA_SERVER_URL: ${{ secrets.EXPO_PUBLIC_BETA_SERVER_URL }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          # bundletool ooms on the 59mb model if it inherits r8's retained heap
          ./gradlew --stop
          ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Publish beta release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --yes || true
          git push origin :refs/tags/beta || true
          gh release create beta \
            android/app/build/outputs/apk/release/app-release.apk \
            --title "Beta Release" \
            --notes "Automated beta build from the latest push." \
            --target "$GITHUB_SHA" \
            --prerelease

      - name: Publish versioned release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # a re-pushed tag rebuilds the same version, so replace the release
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" \
            android/app/build/outputs/apk/release/app-release.apk \
            --title "Opera ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --latest

      # requires the very first release to have been uploaded manually through
      # the Play Console; the API can't create that initial listing
      - name: Upload to Play Store closed alpha track
        if: github.ref_type == 'tag' && env.HAS_PLAY_SA == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.maestro.opera
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          # singular track is deprecated by the action
          tracks: alpha
          status: completed
          releaseName: ${{ github.ref_name }}
          whatsNewDirectory: distribution/whatsnew
